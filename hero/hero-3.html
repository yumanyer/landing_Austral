<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Austral — Hero</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0
    }
  </style>
</head>

<body>
  <section class="ah" aria-labelledby="ah-title">
    <div class="ah__grid">
      <div class="ah__copy">
        <h1 id="ah-title">Build markets that don't exist yet.</h1>
        <p class="ah__sub">Financial infrastructure for the next generation of Latin American markets.</p>
        <div class="ah__cta">
          <a class="ah__btn" href="#waitlist">Join the waitlist</a>
          <a class="ah__btn ah__btn--ghost" href="#problem">Explore Austral</a>
        </div>
      </div>
      <div class="ah__visual">
        <!-- Fallback 2D (siempre se genera; se oculta si el 3D arranca) -->
        <svg viewBox="0 0 400 400" role="img" aria-label="Scattered points resolving into an upward direction"></svg>
        <canvas aria-hidden="true"></canvas>
      </div>
    </div>
  </section>

  <style is:global>
    .ah {
      --ah-cel: var(--color-celeste, #75AADB);
      --ah-deep: var(--color-deep-austral, #102A33);
      --ah-slate: var(--color-slate, #55717A);
      padding-block: clamp(3rem, 8vw, 6rem);
      background: #fff;
      color: var(--ah-deep);
      font-family: var(--font-ui, "Die Grotesk", "Helvetica Neue", Arial, sans-serif)
    }

    .ah__grid {
      width: min(100% - 2.5rem, 1120px);
      margin-inline: auto;
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 3rem;
      align-items: center
    }

    .ah h1 {
      font-family: var(--font-serif, "Lora", Georgia, serif);
      font-weight: 500;
      font-size: clamp(3rem, 8.5vw, 7rem);
      line-height: 1.02;
      letter-spacing: -.03em;
      margin: 0 0 1.5rem
    }

    .ah__sub {
      font-size: 1.25rem;
      line-height: 1.5;
      color: var(--ah-slate);
      max-width: 34rem;
      margin: 0 0 2.5rem
    }

    .ah__cta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap
    }

    .ah__btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: .5rem 1.5rem;
      border: 1px solid var(--ah-deep);
      border-radius: 2px;
      background: var(--ah-deep);
      color: #fff;
      font: 600 .875rem/1 inherit;
      font-family: inherit;
      text-decoration: none;
      transition: background .18s, color .18s, border-color .18s
    }

    .ah__btn:hover {
      background: var(--ah-cel);
      border-color: var(--ah-cel);
      color: var(--ah-deep)
    }

    .ah__btn--ghost {
      background: none;
      color: var(--ah-deep)
    }

    .ah__btn--ghost:hover {
      background: #e9f0f6;
      border-color: #e9f0f6
    }

    .ah__btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(117, 170, 219, .6)
    }

    .ah__visual {
      position: relative;
      width: 100%;
      max-width: 600px;
      aspect-ratio: 1;
      justify-self: end
    }

    .ah__visual svg,
    .ah__visual canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%
    }

    .ah__visual canvas {
      display: none
    }

    .ah.is-gl .ah__visual svg {
      display: none
    }

    .ah.is-gl .ah__visual canvas {
      display: block
    }

    .ah__visual circle {
      fill: var(--ah-cel);
      animation: ah-settle 2s cubic-bezier(.2, .7, .2, 1) both
    }

    .ah__visual circle.d {
      fill: var(--ah-deep)
    }

    @keyframes ah-settle {
      from {
        transform: translate(var(--dx), var(--dy));
        opacity: .35
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    @media (max-width:860px) {
      .ah__grid {
        grid-template-columns: 1fr
      }

      .ah__visual {
        justify-self: center;
        max-width: 420px
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .ah__visual circle {
        animation: none
      }
    }
  </style>
